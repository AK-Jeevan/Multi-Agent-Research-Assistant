<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Research Assistant</title>
  <style>
    :root { color-scheme: dark; --ink:#edf2ff; --muted:#9da9c5; --line:rgba(167,184,226,.18); --card:rgba(18,27,51,.78); --blue:#7c9cff; --mint:#66ddb4; --amber:#ffca70; --red:#ff8c9c; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; background:radial-gradient(circle at 18% 0%,#202f63 0,transparent 30rem),radial-gradient(circle at 90% 20%,#183c50 0,transparent 27rem),#0b1020; }
    main { width:min(920px,calc(100% - 32px)); margin:0 auto; padding:72px 0 48px; }
    .eyebrow { color:var(--mint); font-size:.78rem; font-weight:750; letter-spacing:.14em; text-transform:uppercase; }
    h1 { max-width:720px; margin:12px 0; font-size:clamp(2.3rem,7vw,4.8rem); line-height:1.02; letter-spacing:-.065em; }
    .intro { max-width:620px; margin:0 0 32px; color:var(--muted); font-size:1.05rem; line-height:1.6; }
    .panel,.result { background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:0 22px 60px rgba(0,0,0,.22); backdrop-filter:blur(14px); }
    .panel { padding:14px; }
    label { display:block; margin:4px 6px 9px; color:var(--muted); font-size:.82rem; font-weight:650; }
    .input-row { display:flex; gap:10px; }
    input { min-width:0; flex:1; padding:15px 16px; border:1px solid transparent; border-radius:12px; outline:0; color:var(--ink); background:#0b1122; font:inherit; }
    input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(124,156,255,.18); }
    button { border:0; border-radius:12px; padding:0 21px; color:#07101f; background:linear-gradient(135deg,#92adff,#66ddb4); font:700 .95rem/1 inherit; cursor:pointer; transition:transform .18s,opacity .18s; }
    button:hover:not(:disabled) { transform:translateY(-1px); }
    button:disabled { cursor:wait; opacity:.65; }
    .hint { margin:12px 6px 0; color:var(--muted); font-size:.82rem; }
    #results { margin-top:22px; }
    .result { padding:24px; }
    .result + .result { margin-top:14px; }
    .topline { display:flex; justify-content:space-between; gap:14px; align-items:center; }
    h2 { margin:0; font-size:.92rem; letter-spacing:.08em; text-transform:uppercase; }
    .badge { display:inline-flex; padding:6px 10px; border-radius:999px; font-size:.78rem; font-weight:750; }
    .supported { color:var(--mint); background:rgba(102,221,180,.12); } .needs-revision { color:var(--amber); background:rgba(255,202,112,.12); } .blocked { color:var(--red); background:rgba(255,140,156,.12); }
    .meta { display:flex; flex-wrap:wrap; gap:10px 22px; margin-top:17px; color:var(--muted); font-size:.88rem; }
    .summary { margin:14px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; color:#dce5ff; font:400 .96rem/1.65 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .loading,.error { padding:18px 6px; color:var(--muted); } .error { color:var(--red); }
    @media (max-width:600px) { main{padding-top:48px}.input-row{flex-direction:column}button{min-height:50px}.topline{align-items:flex-start;flex-direction:column} }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Multi-agent research workspace</div>
    <h1>Turn a question into grounded research.</h1>
    <p class="intro">Your manager, researcher, critic, and approval agents work together to gather evidence and flag uncertainty before you use the result.</p>
    <form class="panel" id="research-form">
      <label for="question">What would you like to investigate?</label>
      <div class="input-row"><input id="question" name="question" autocomplete="off" maxlength="2000" placeholder="e.g. What is hybrid retrieval?" required><button id="submit-button" type="submit">Start research</button></div>
      <p class="hint">Results include the agent's confidence and risk assessment.</p>
    </form>
    <section id="results" aria-live="polite"></section>
  </main>
  <script>
    const form = document.querySelector('#research-form');
    const input = document.querySelector('#question');
    const button = document.querySelector('#submit-button');
    const results = document.querySelector('#results');
    const escapeHtml = value => { const element = document.createElement('div'); element.textContent = String(value ?? ''); return element.innerHTML; };
    const display = value => value === null || value === undefined || value === '' ? 'n/a' : escapeHtml(value);
    function render(data) {
      const critique = data.trace_summary || {};
      const security = data.security || {};
      const approval = data.approval || {};
      const rawStatus = security.blocked ? 'blocked' : (approval.risk_level === 'high' ? 'needs-revision' : 'supported');
      const label = security.blocked ? 'Blocked for safety' : approval.risk_level === 'high' ? 'Needs review' : 'Research complete';
      const duration = Number(critique.duration_seconds);
      results.innerHTML = `<article class="result"><div class="topline"><h2>Research status</h2><span class="badge ${rawStatus}">${label}</span></div><div class="meta"><span>Risk: ${display(approval.risk_level)}</span><span>Confidence: ${display(approval.confidence)}</span><span>Events: ${display(critique.event_count)}</span><span>Duration: ${Number.isFinite(duration) ? duration.toFixed(1) + 's' : 'n/a'}</span></div></article><article class="result"><h2>Summary</h2><div class="summary">${escapeHtml(data.summary || 'No summary was produced.')}</div></article>`;
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) { input.focus(); return; }
      button.disabled = true; button.textContent = 'Researching…';
      results.innerHTML = '<p class="loading">Running manager → researcher → critic → summarizer → approval…</p>';
      try {
        const response = await fetch('/research', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question}) });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.detail || `The server returned ${response.status}.`);
        render(payload);
      } catch (error) { results.innerHTML = `<p class="error">Research request failed: ${escapeHtml(error.message)}</p>`; }
      finally { button.disabled = false; button.textContent = 'Start research'; }
    });
  </script>
</body>
</html>
